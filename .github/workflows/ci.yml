name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            cmake \
            ninja-build \
            clang \
            cppcheck

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure sanitizer build
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFISHBY_SANITIZERS=ON

      - name: Build with sanitizers
        run: cmake --build build-san

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build-san --output-on-failure

      - name: Clang Static Analyzer
        run: make analyze

      - name: Cppcheck
        run: make lint

      - name: Package Linux binary
        run: tar -czf fishby-linux-x86_64.tar.gz -C build fishby

      - name: Upload Linux binary
        uses: actions/upload-artifact@v6
        with:
          name: fishby-linux-x86_64
          path: fishby-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 20

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MinGW environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build PDCurses
        run: |
          git clone --depth 1 --branch 3.9 \
            https://github.com/wmcbrine/PDCurses.git \
            "$RUNNER_TEMP/PDCurses"

          make -C "$RUNNER_TEMP/PDCurses/wincon" \
            CC=gcc \
            AR=ar \
            WINDRES=windres \
            pdcurses.a

      - name: Configure
        run: |
          PDC_ROOT="$(cygpath -m "$RUNNER_TEMP/PDCurses")"

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DBUILD_TESTING=ON \
            -DFISHBY_HARDENING=ON \
            -DPDCURSES_INCLUDE_DIR="$PDC_ROOT" \
            -DPDCURSES_LIBRARY="$PDC_ROOT/wincon/pdcurses.a" \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload Windows binary
        uses: actions/upload-artifact@v6
        with:
          name: fishby-windows-x86_64
          path: build/fishby.exe
          if-no-files-found: error
          retention-days: 14
